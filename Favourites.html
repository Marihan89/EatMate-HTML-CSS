<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EatMate..your Mate</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/formpage.css" />
        <link rel="stylesheet" href="css/components.css" />
    </head>
    <body class="Default">
        <header>
            <div class="menuicons" id="logoicon">
                <img src="images/new logo.webp" alt="Logo" />
            </div>
            <div id="menuicon">
                <img src="images/menu.svg" alt="Menu" />
            </div>
        </header>
        <main>
            <section class="container" id="contentHeading">
                <img src="images/header.webp" alt="Image of the app logo" />
            </section>
            <section class="container" id="content">
                <nav>
                    <ul id="filteration">
                        <li><button class="btn" id="All">ALL</button></li>
                        <li>
                            <button class="btn" id="Chicken">Chicken</button>
                        </li>
                        <li><button class="btn" id="Beef">Beef</button></li>
                        <li>
                            <button class="btn" id="filtericon">
                                <i class="bi bi-funnel" aria-hidden="true"></i>
                            </button>
                        </li>
                    </ul>
                </nav>
                <div class="subcontainer">
                    <input
                        type="text"
                        class="field"
                        id="recpname"
                        placeholder="Recipe Name"
                    />
                    <button class="btn" id="searchrecp">
                        <i class="bi bi-search" aria-hidden="true"></i>
                    </button>
                </div>
            </section>
            <section class="container" id="contentDetails"></section>
        </main>

        <footer></footer>
    </body>
</html>
