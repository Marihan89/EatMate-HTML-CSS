<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EatMate..your Mate</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/formpage.css" />
        <link rel="stylesheet" href="css/components.css" />
    </head>
    <body class="formpage">
        <header></header>
        <main>
            <section id="contentHeading">
                <h1>Create an account</h1>
                <p>Join EatMate and start your tasty journey</p>
            </section>
            <section id="content">
                <form>
                    <div class="formfield">
                        <label for="name">Full Name</label>
                        <div class="field-input">
                            <i
                                class="fa-solid fa-user"
                                style="color: #604735"
                            ></i>
                            <input
                                type="text"
                                id="name"
                                placeholder="Enter Your Name "
                                required
                            />
                        </div>
                    </div>
                    <div class="formfield">
                        <label for="email">E-mail</label>
                        <div class="field-input">
                            <i
                                class="fa-solid fa-envelope"
                                style="color: #604735"
                            ></i>
                            <input
                                type="email"
                                id="email"
                                placeholder="Enter a valid email"
                                required
                            />
                        </div>
                    </div>
                    <div class="formfield">
                        <label for="password">Password</label>
                        <div class="field-input">
                            <i
                                class="fa-solid fa-unlock-keyhole"
                                style="color: #604735"
                            ></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter a strong password"
                                required
                            />
                        </div>
                    </div>
                    <!-- <fieldset>
                        <div class="formfiled">
                            <input type="checkbox" id="rememberme" />
                            <span name="rememberme">Remember Me</span>
                        </div>
                        <div class="formfiled">
                            <a href="index.html">Forgot your Password ?</a>
                        </div>
                    </fieldset> -->
                    <button class="btn" id="login">Create account</button>
                </form>
            </section>
            <section id="contentDetails">
                <nav>
                    <ul>
                        <li>
                            <a href="https://www.facebook.com/">
                                <i class="bi bi-facebook"> </i
                            ></a>
                        </li>
                        <li>
                            <a href="https://www.instagram.com/"
                                ><i class="bi bi-instagram"></i
                            ></a>
                        </li>
                    </ul>
                </nav>
            </section>
        </main>

        <footer></footer>
    </body>
</html>
